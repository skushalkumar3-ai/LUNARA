<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LUNARA — Junior Astronaut Mission Trainer</title>
<style>
:root{color-scheme:dark;--bg:#04060f;--fg:#f4f6ff;--gold:#ffc83d;--accent:#ff5a36;box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS",system-ui,sans-serif;overflow:hidden}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 16px calc(9vh + env(safe-area-inset-bottom,0px));text-align:center}
#top{position:fixed;top:calc(10vh + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;pointer-events:none}
#cap{font-size:clamp(16px,2.6vw,26px);text-shadow:0 2px 8px #000;max-width:900px;min-height:2.4em;margin:0 0 14px}
#title{font-size:clamp(20px,3.4vw,38px);font-weight:900;color:var(--gold);text-shadow:0 2px 10px #000;letter-spacing:.05em}
#sub{font-size:clamp(14px,2vw,20px);text-shadow:0 2px 8px #000;margin-top:4px}
button{pointer-events:auto;font:inherit;font-weight:900;font-size:clamp(18px,3vw,28px);padding:.7em 1.4em;border:0;border-radius:999px;color:#fff;background:linear-gradient(#ff7a4d,var(--accent));box-shadow:0 6px 0 #a02a12,0 0 30px #ff5a3699;cursor:pointer;animation:pulse 1.3s infinite}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #a02a12}
button.hide{display:none}
@keyframes pulse{50%{filter:brightness(1.25);transform:scale(1.04)}}
#big{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:clamp(34px,8vw,96px);font-weight:900;color:var(--gold);text-shadow:0 4px 20px #000;text-align:center;padding:0 20px;flex-direction:column}
#big small{font-size:.28em;color:var(--fg);font-weight:400;margin-top:10px}
#mute{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:20;width:44px;height:44px;padding:0;font-size:20px;line-height:1;border-radius:50%;animation:none;background:#000a;box-shadow:0 0 0 2px #ffffff55}
#mute:active{transform:none;box-shadow:0 0 0 2px #ffffff99}

/* ---------- LUNARA cinematic presentation layer ---------- */
:root{
  --gold:#f3cf83;
  --accent:#d99b55;
  --ice:#b9d9f5;
  --panel:rgba(5,12,27,.58);
}
body{isolation:isolate}
canvas{filter:saturate(1.08) contrast(1.04)}
body::before{
  content:"";position:fixed;inset:0;z-index:2;pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 42%,transparent 28%,rgba(0,0,0,.18) 72%,rgba(0,0,0,.55) 100%),
    linear-gradient(180deg,rgba(2,7,18,.22),transparent 24%,transparent 72%,rgba(2,7,18,.36));
}
body::after{
  content:"";position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.12;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.10) 0,rgba(255,255,255,.10) 1px,transparent 1px,transparent 4px);
  mix-blend-mode:soft-light;
}
#top{z-index:5;top:clamp(34px,9vh,92px);padding:0 20px}
#title{
  color:#f4d89a;letter-spacing:.22em;font-size:clamp(25px,4.2vw,54px);
  text-shadow:0 0 18px rgba(243,207,131,.25),0 3px 18px #000;
}
#sub{
  color:#d9e7f7;letter-spacing:.20em;font-size:clamp(10px,1.35vw,15px);
  text-transform:uppercase;margin-top:12px;text-shadow:0 2px 12px #000;
}
#ui{z-index:6;padding-bottom:calc(7vh + env(safe-area-inset-bottom,0px))}
#cap{
  display:inline-block;box-sizing:border-box;max-width:min(780px,92vw);
  padding:12px 22px;border:1px solid rgba(190,216,245,.22);
  border-radius:999px;background:linear-gradient(135deg,rgba(8,18,36,.72),rgba(8,18,36,.34));
  color:#edf4ff;font-size:clamp(12px,1.5vw,17px);letter-spacing:.035em;
  line-height:1.5;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 12px 40px rgba(0,0,0,.22);
}
button{
  border:1px solid rgba(255,230,180,.65);
  border-radius:999px;color:#111827;
  background:linear-gradient(180deg,#ffe6ad 0%,#e9b96c 55%,#bd8040 100%);
  box-shadow:0 3px 0 #76502c,0 0 34px rgba(233,185,108,.28);
  letter-spacing:.09em;text-transform:uppercase;
  font-size:clamp(12px,1.45vw,17px);padding:1em 2em;
  animation:missionPulse 2.2s ease-in-out infinite;
  transition:filter .2s ease,box-shadow .2s ease;
}
button:hover{filter:brightness(1.1);box-shadow:0 3px 0 #76502c,0 0 42px rgba(233,185,108,.48)}
button:disabled{opacity:.7;cursor:wait;animation:none}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #76502c}
button.hide{display:none}
@keyframes missionPulse{
  0%,100%{filter:brightness(1);box-shadow:0 3px 0 #76502c,0 0 22px rgba(233,185,108,.18)}
  50%{filter:brightness(1.08);box-shadow:0 3px 0 #76502c,0 0 38px rgba(233,185,108,.38)}
}
#big{z-index:5;text-shadow:0 0 24px rgba(243,207,131,.24),0 4px 24px #000}
#big small{color:#e5edf8;letter-spacing:.05em;line-height:1.5;text-shadow:0 2px 12px #000}
#mute{
  z-index:20;border:1px solid rgba(190,216,245,.35);color:#edf4ff;
  background:rgba(5,12,27,.72);backdrop-filter:blur(12px);
  box-shadow:0 4px 20px rgba(0,0,0,.25);font-size:18px;
}
#transition{
  position:fixed;inset:0;z-index:100;pointer-events:none;opacity:0;
  background:#02040a;transition:opacity .85s ease;
}
#transition.active{opacity:1;pointer-events:auto}
.mission-corner{
  position:fixed;z-index:5;top:18px;left:20px;pointer-events:none;
  color:rgba(220,235,255,.72);font:600 10px/1.4 ui-monospace,monospace;
  letter-spacing:.22em;text-transform:uppercase;
}
.mission-corner::before{
  content:"";display:inline-block;width:7px;height:7px;margin-right:9px;
  border-radius:50%;background:#d9b875;box-shadow:0 0 12px #d9b875;
}
@media(max-width:600px){
  .mission-corner{top:14px;left:14px;font-size:8px;letter-spacing:.14em}
  #top{top:14vh}
  #cap{border-radius:18px;padding:10px 14px}
  #ui{padding-left:12px;padding-right:12px}
}
@media(prefers-reduced-motion:reduce){
  button{animation:none}
  #transition{transition:none}
}

</style></head><body>
<canvas id="c" aria-label="Animated LUNARA mission launch sequence"></canvas>
<div class="mission-corner">LUNARA // MISSION 01</div>
<div id="transition" aria-hidden="true"></div>
<div id="top"><div id="title"></div><div id="sub"></div></div>
<div id="big"></div>
<div id="ui"><p id="cap"></p><button id="b1">🚀 Begin Mission</button></div>
<script>
const C=document.getElementById('c'),x=C.getContext('2d'),b=document.getElementById('b1'),cap=document.getElementById('cap'),big=document.getElementById('big'),ti=document.getElementById('title'),su=document.getElementById('sub');
let W,H,dpr;function rs(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*dpr;C.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}rs();addEventListener('resize',rs,{passive:true});
const rnd=(a,b)=>a+Math.random()*(b-a),lerp=(a,b,t)=>a+(b-a)*t,cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const stars=Array.from({length:460},()=>({x:rnd(-1,1),y:rnd(-1,1),z:rnd(.05,1),s:rnd(.5,2)}));
const craters=Array.from({length:40},()=>({a:rnd(0,6.28),d:Math.sqrt(Math.random()),r:rnd(.04,.14)}));
let scene='title',t0=performance.now(),T=0;
function go(s){scene=s;t0=performance.now();b.className='hide';cap.textContent='';big.innerHTML='';ti.textContent='';su.textContent=''}
function staticStars(a=1){x.fillStyle='#fff';for(const s of stars){x.globalAlpha=a*(.4+.6*Math.abs(Math.sin(T*s.z*3+s.x*9)));x.fillRect((s.x*.5+.5)*W,(s.y*.5+.5)*H*.8,s.s,s.s)}x.globalAlpha=1}

/* ---------- characters ---------- */
function astro(px,py,s,col,ph,leader){
  x.save();x.translate(px,py);x.scale(s,s);
  if(leader){ // cape
    x.fillStyle='#d6212b';x.beginPath();x.moveTo(-8,-62);
    for(let i=0;i<=6;i++)x.lineTo(-12-i*9,-62+i*8+Math.sin(T*4+i)*5);
    x.lineTo(-62,-8+Math.sin(T*4)*6);x.lineTo(-12,-24);x.closePath();x.fill();
  }
  const leg=(a,c)=>{x.save();x.translate(0,-30);x.rotate(a);x.fillStyle=c;x.beginPath();x.roundRect(-5,0,10,30,4);x.fill();x.fillStyle='#333';x.fillRect(-6,26,13,5);x.restore()};
  const arm=(a)=>{x.save();x.translate(0,-58);x.rotate(a);x.fillStyle=col;x.beginPath();x.roundRect(-4,0,8,24,4);x.fill();x.fillStyle='#ddd';x.beginPath();x.arc(0,26,5,0,7);x.fill();x.restore()};
  const sw=Math.sin(ph)*.55;
  leg(sw,'#c9ccd6');arm(-sw);
  x.fillStyle='#e8eaf2';x.beginPath();x.roundRect(-20,-60,10,34,4);x.fill(); // pack
  x.fillStyle=col;x.beginPath();x.roundRect(-13,-64,26,38,8);x.fill();
  x.fillStyle='#fff8';x.fillRect(-7,-52,14,8);
  leg(-sw,'#e5e7ee');arm(sw);
  x.fillStyle='#f2f4fa';x.beginPath();x.arc(2,-74,15,0,7);x.fill();
  const g=x.createLinearGradient(0,-86,0,-62);g.addColorStop(0,'#5ad0ff');g.addColorStop(1,'#1a2a6a');
  x.fillStyle=g;x.beginPath();x.ellipse(7,-74,9,10,0,0,7);x.fill();
  x.fillStyle='#fff9';x.beginPath();x.ellipse(10,-78,3,4,.5,0,7);x.fill();
  if(leader){x.fillStyle='var(--gold)';x.fillStyle='#ffc83d';x.fillRect(-12,-50,6,6)}
  x.restore();
}
/* ---------- NASA-style insignia (simplified drawing) ---------- */
function missionPatch(cx,cy,r){
  x.save();x.translate(cx,cy);
  x.fillStyle='#0b3d91';x.beginPath();x.arc(0,0,r,0,7);x.fill();
  x.fillStyle='#fff';[[-.6,-.5],[-.2,-.7],[.45,-.55],[.7,.1],[-.7,.15],[.2,.7],[-.4,.6],[.55,.5]].forEach(([a,b])=>{x.beginPath();x.arc(a*r,b*r,Math.max(.4,r*.05),0,7);x.fill()});
  x.strokeStyle='#fff';x.lineWidth=Math.max(.7,r*.07);x.beginPath();x.ellipse(0,0,r*1.0,r*.34,-.5,0,7);x.stroke();
  x.fillStyle='#fc3d21';x.beginPath();x.moveTo(-.72*r,.5*r);x.lineTo(-.12*r,-.45*r);x.lineTo(.1*r,-.05*r);x.lineTo(.5*r,-.38*r);x.lineTo(.2*r,.2*r);x.lineTo(-.05*r,.12*r);x.lineTo(-.4*r,.62*r);x.closePath();x.fill();
  x.strokeStyle='#fff';x.lineWidth=Math.max(.7,r*.07);x.beginPath();x.arc(0,0,r,0,7);x.stroke();
  x.restore();
}
/* ---------- rocket (heavy-lift style: orange core, twin white boosters, capsule on top) ---------- */
function rocket(px,by,h,flame,shake){
  const u=h*.1,cw=u*.95,bw=u*.55,bx=cw/2+bw/2;
  x.save();x.translate(px+(shake?rnd(-shake,shake):0),by);
  if(flame>0){[[-bx,bw*.85,1.1],[0,cw*.85,.9],[bx,bw*.85,1.1]].forEach(([fx,fw,m])=>{const f=h*.33*flame*m;const g=x.createLinearGradient(0,0,0,f);g.addColorStop(0,'#fff');g.addColorStop(.3,'#ffd23d');g.addColorStop(1,'#ff4a1a00');
    x.fillStyle=g;x.beginPath();x.moveTo(fx-fw/2,0);x.quadraticCurveTo(fx,f*(1+Math.random()*.2),fx+fw/2,0);x.fill()})}
  const hg=(w,c0,c1,c2)=>{const g=x.createLinearGradient(-w/2,0,w/2,0);g.addColorStop(0,c0);g.addColorStop(.45,c1);g.addColorStop(1,c2);return g};
  // engine nozzles
  x.fillStyle='#2b2f3a';[0].forEach(()=>{x.beginPath();x.moveTo(-cw*.3,-u*.3);x.lineTo(cw*.3,-u*.3);x.lineTo(cw*.42,0);x.lineTo(-cw*.42,0);x.fill()});
  // core stage
  x.fillStyle=hg(cw,'#a8431a','#ff8d40','#8f3513');x.fillRect(-cw/2,-h*.76,cw,h*.76-u*.3);
  // upper stage + capsule + escape tower
  x.fillStyle=hg(cw,'#b9bfcf','#fff','#9aa1b3');x.fillRect(-cw*.42,-h*.84,cw*.84,h*.09);
  x.beginPath();x.moveTo(-cw*.42,-h*.84);x.lineTo(-cw*.24,-h*.92);x.lineTo(cw*.24,-h*.92);x.lineTo(cw*.42,-h*.84);x.fill();
  x.fillStyle='#7d8498';x.fillRect(-u*.04,-h*1.04,u*.08,h*.12);
  x.fillStyle='#e9ebf2';x.beginPath();x.moveTo(-u*.16,-h*.97);x.lineTo(0,-h*1.09);x.lineTo(u*.16,-h*.97);x.fill();
  // side boosters
  [-1,1].forEach(sg=>{const c=sg*bx;x.save();x.translate(c,0);
    x.fillStyle=hg(bw,'#aeb4c4','#fff','#9097a8');x.fillRect(-bw/2,-h*.66,bw,h*.66-u*.15);
    x.beginPath();x.moveTo(-bw/2,-h*.66);x.quadraticCurveTo(-bw*.4,-h*.8,0,-h*.86);x.quadraticCurveTo(bw*.4,-h*.8,bw/2,-h*.66);x.fill();
    x.fillStyle='#1b1e27';x.fillRect(-bw/2,-h*.5,bw,h*.03);x.fillRect(-bw/2,-h*.14,bw,h*.03);
    x.fillStyle='#d6212b';x.fillRect(-bw/2,-h*.46,bw,h*.012);
    x.fillStyle='#2b2f3a';x.beginPath();x.moveTo(-bw*.28,-u*.15);x.lineTo(bw*.28,-u*.15);x.lineTo(bw*.38,0);x.lineTo(-bw*.38,0);x.fill();
    x.restore()});
  // NASA insignia + lettering on the core
  missionPatch(0,-h*.58,cw*.34);
  x.fillStyle='#fff';x.font='bold '+Math.max(6,cw*.26)+'px Arial,sans-serif';x.textAlign='center';x.fillText('LUNARA',0,-h*.58+cw*.62);
  x.restore();
}
/* ---------- planets ---------- */
const P=[
 ['Mercury','#b8b0a6','#4d4741',.5,'Mercury zooms around the Sun in only 88 days!'],
 ['Venus','#f2d08a','#9a5d1e',.8,'Venus is the hottest planet, even hotter than Mercury.'],
 ['Earth','#3b8cff','#0b2a6e',.85,'Earth, our home, is the only planet known to have life.'],
 ['Mars','#e2663a','#6b210e',.65,'Mars is red because of rusty iron dust.'],
 ['Jupiter','#e8c9a0','#8a5a35',1.5,'Jupiter is so big that 1,300 Earths could fit inside.'],
 ['Saturn','#efdca3','#8e7440',1.3,'Saturn’s rings are made of ice and rock chunks.'],
 ['Uranus','#a8ecf0','#2b8a99',1,'Uranus spins on its side like a rolling ball.'],
 ['Neptune','#4a6bff','#10206e',1,'Neptune has the fastest winds in the Solar System.']];
function sphere(px,py,r,c1,c2,name){
  const g=x.createRadialGradient(px-r*.4,py-r*.4,r*.1,px,py,r);g.addColorStop(0,c1);g.addColorStop(1,c2);
  if(name==='Saturn'){x.save();x.translate(px,py);x.rotate(-.35);x.strokeStyle='#d8c490aa';for(let i=0;i<4;i++){x.lineWidth=r*(.12-i*.02);x.beginPath();x.ellipse(0,0,r*(1.5+i*.18),r*(.4+i*.05),0,Math.PI,2*Math.PI);x.stroke()}x.restore()}
  x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,7);x.fill();
  x.save();x.beginPath();x.arc(px,py,r,0,7);x.clip();
  if(name==='Jupiter'||name==='Saturn'||name==='Neptune'){x.fillStyle='#0003';for(let i=-3;i<4;i++)x.fillRect(px-r,py+i*r*.27,2*r,r*.1)}
  if(name==='Earth'){x.fillStyle='#3cb55a';[[-.3,-.2,.35],[.3,.25,.3],[.05,.55,.18]].forEach(([a,b,s])=>{x.beginPath();x.arc(px+a*r,py+b*r,s*r,0,7);x.fill()});x.fillStyle='#fff8';x.beginPath();x.ellipse(px-r*.3,py+r*.1,r*.4,r*.1,.4,0,7);x.fill()}
  if(name==='Mars'){x.fillStyle='#fff9';x.beginPath();x.arc(px,py-r*.95,r*.3,0,7);x.fill()}
  if(name==='Jupiter'){x.fillStyle='#c0482a';x.beginPath();x.ellipse(px+r*.3,py+r*.25,r*.2,r*.12,0,0,7);x.fill()}
  if(name==='Moon'||name==='Mercury'||name==='Pluto'){x.fillStyle='#0003';craters.forEach(k=>{x.beginPath();x.arc(px+Math.cos(k.a)*k.d*r*.85,py+Math.sin(k.a)*k.d*r*.85,k.r*r,0,7);x.fill()})}
  const sh=x.createRadialGradient(px-r*.5,py-r*.4,r*.4,px,py,r*1.1);sh.addColorStop(0,'#0000');sh.addColorStop(1,'#000b');x.fillStyle=sh;x.fillRect(px-r,py-r,2*r,2*r);
  x.restore();
}
/* ---------- NASA Planetary Fact Sheet snapshot + procedural realistic textures ---------- */
const NASA={Mercury:['4,879 km','57.9 million km','88 Earth days','3.7 m/s²','167 °C'],Venus:['12,104 km','108.2 million km','224.7 Earth days','8.9 m/s²','464 °C'],Earth:['12,756 km','149.6 million km','365.2 days','9.8 m/s²','15 °C'],Mars:['6,792 km','227.9 million km','687 Earth days','3.7 m/s²','-65 °C'],Jupiter:['142,984 km','778.5 million km','11.9 Earth years','23.1 m/s²','-110 °C'],Saturn:['120,536 km','1,432 million km','29.4 Earth years','9.0 m/s²','-140 °C'],Uranus:['51,118 km','2,867 million km','84 Earth years','8.7 m/s²','-195 °C'],Neptune:['49,528 km','4,515 million km','164.8 Earth years','11.0 m/s²','-200 °C'],Moon:['3,475 km','384,400 km from Earth','27.3 Earth days','1.62 m/s²','-20 °C avg']};
const NL=['Diameter','Distance from Sun','Year length','Surface gravity','Avg. temperature'];
const DK={Mercury:4879,Venus:12104,Earth:12756,Mars:6792,Jupiter:142984,Saturn:120536,Uranus:51118,Neptune:49528};
const psize=n=>Math.pow(DK[n]/142984,.4)*1.6;let curPanel='';
function h3(i,j,k){const n=Math.sin(i*127.1+j*311.7+k*74.7)*43758.5453;return n-Math.floor(n)}
function vn(X,Y,Z){const i=Math.floor(X),j=Math.floor(Y),k=Math.floor(Z),s=t=>t*t*(3-2*t),a=s(X-i),b=s(Y-j),c=s(Z-k);let r=0;for(let p=0;p<2;p++)for(let q=0;q<2;q++)for(let w=0;w<2;w++)r+=h3(i+p,j+q,k+w)*(p?a:1-a)*(q?b:1-b)*(w?c:1-c);return r}
function fbm(X,Y,Z,o=5){let r=0,a=.5,f=1;for(let l=0;l<o;l++){r+=a*vn(X*f,Y*f,Z*f);f*=2;a*=.5}return r}
const mix=(a,b,t)=>{t=cl(t);return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]};
function col(n,X,Y,Z){const F=(s,o,k=0)=>fbm(X*s+k,Y*s+k,Z*s+k,o);
 if(n==='Moon'||n==='Mercury'){const e=F(5,6),m=n==='Moon'?F(1.6,3,7):0;let v=70+e*130+(F(18,2)-.5)*50;if(m>.52)v*=.6;return[v,v*.98,v*.95]}
 if(n==='Earth'){const e=F(2.4,6),c=F(3,5,20);let k;if(e<.5)k=mix([5,25,70],[22,85,155],(e-.3)*5);else{k=mix([60,115,50],[135,110,70],(e-.5)*4+Math.abs(Y)*.3-.2);if(e>.66)k=mix(k,[235,235,240],(e-.66)*8)}if(Math.abs(Y)>.86)k=[240,245,250];return mix(k,[255,255,255],cl((c-.5)*3.5)*.9)}
 if(n==='Venus'){const s=F(2,5);return mix([200,150,80],[245,215,150],(Math.sin(Y*6+s*5)*.5+.5)*.7+s*.3)}
 if(n==='Mars'){const e=F(3,6);let k=mix([185,100,55],[120,60,40],(.5-e)*3+.3);if(Math.abs(Y)>.9)k=[240,240,245];return mix(k,[215,140,90],F(12,2)*.4)}
 if(n==='Jupiter'||n==='Saturn'){const t=F(3,4,5)*.6,J=n==='Jupiter',b=Math.sin(Y*(J?16:11)+t*4)*.5+.5;let k=J?mix([150,100,65],[238,215,185],b):mix([180,150,100],[235,215,160],b);if(J){const dd=Math.pow((Math.atan2(Z,X)-1)*1.3,2)+Math.pow((Y+.3)*3,2);if(dd<.1)k=mix(k,[190,80,50],1-dd*10)}return k}
 if(n==='Uranus')return mix([130,205,215],[175,228,232],Math.sin(Y*8)*.5+.5+F(3,3)*.2);

function enterLunara(){
  const overlay=document.getElementById('transition');
  if(b.disabled)return;
  b.disabled=true;
  b.textContent='ESTABLISHING SURFACE LINK…';
  overlay.classList.add('active');
  // Fade fully to black before React swaps the iframe for SurfaceTutorial.
  setTimeout(()=>{
    if(window.parent!==window){
      window.parent.postMessage(
        {type:'LUNARA_LAUNCH_COMPLETE'},
        window.location.origin
      );
    }else{
      // When opened directly for preview, restart instead of posting to a host.
      overlay.classList.remove('active');
      go('title');
    }
  },900);
}

    astro(lx-W*.15,gy+30,H/390,'#ffc83d',Math.sin(T)*0.3,true);
    big.innerHTML='TOUCHDOWN CONFIRMED<small>LUNARA-01 // Crew safe. Lunar surface operations are ready.</small>';
    if(b.className){b.textContent='ENTER LUNARA';b.className='';b.disabled=false;b.onclick=enterLunara}
  }else cap.textContent='Touchdown in progress… engines firing!';

/* ---------- original synthesized soundtrack (Web Audio, no files needed) ---------- */
(function(){

function mkbus(wet,vol){const g=ctx.createGain();g.gain.value=vol;const w=ctx.createGain();w.gain.value=wet;g.connect(master);g.connect(w);w.connect(rev);return{g,w}}

const WCH=[[62,66,69],[61,64,69],[62,66,71],[62,67,71]],WROOT=[38,45,47,43];
const WMEL=[[[0,74,1.5],[1.5,76,.5],[2,78,1],[3,81,1]],[[0,76,1],[1,78,1],[2,81,1.5],[3.5,78,.5]],[[0,78,1.5],[1.5,76,.5],[2,74,1],[3,73,1]],[[0,74,1],[1,79,1],[2,78,1],[3,76,1]]];
const SC={
 /* calm, wondering pads with soft bells */
 title:{bpm:60,wet:.7,vol:.8,bar(S,n,t,b){
   const ch=[[50,57,64,65,69],[46,53,57,60,65],[41,53,57,60,64],[48,55,60,62,67]][n%4];

   [[.5,2],[1.25,3],[2,4],[2.75,3],[3.5,2]].forEach(([o,i])=>tone(S.bus,mtof(ch[i]+12),t+o*b,1.8,'sine',.05,{pluck:1,a:.005}));
 }},
 /* heroic march while the crew walks to the rocket */

   const k=n%4,B=S.bus,ch=WCH[k],root=WROOT[k];
   kick(B,t);kick(B,t+2*b);snare(B,t+b);snare(B,t+3*b);for(let i=0;i<8;i++)hat(B,t+i*b/2);
   tone(B,mtof(root),t,1.4*b,'triangle',.22,{a:.01,r:.2});tone(B,mtof(root+12),t+2*b,.9*b,'triangle',.16,{a:.01,r:.15});tone(B,mtof(root),t+3*b,.9*b,'triangle',.16,{a:.01,r:.15});
   ch.forEach(m=>tone(B,mtof(m-12),t,4*b,'sawtooth',.018,{lp:900,a:.12,r:.3}));
   WMEL[k].forEach(([o,m,d])=>{tone(B,mtof(m),t+o*b,d*b,'sawtooth',.026,{lp:2200,a:.04,r:.1,det:-6});tone(B,mtof(m),t+o*b,d*b,'sawtooth',.026,{lp:2200,a:.04,r:.1,det:6})});
 }},
 /* countdown beeps, engine rumble and a rising, driving score */
 launch:{bpm:120,wet:.25,vol:1,start(S,t0){const B=S.bus;
   [0,1,2].forEach(i=>tone(B,880,t0+i,.16,'sine',.25,{a:.005,r:.05}));
   tone(B,1320,t0+3,.7,'sine',.28,{a:.01,r:.3});tone(B,660,t0+3,.7,'triangle',.15,{a:.01,r:.3});
   rumble(B,t0+2,{f0:70,f1:900,v:.55,rise:2.5,len:9});
   tone(B,55,t0+2.5,7,'sawtooth',.06,{glide:330,lp:1200,a:2.5,r:.5});
  },bar(S,n,t,b){
   if(t<S.t0+2)return;const B=S.bus,f=Math.min(1,(t-S.t0)/6+.4),pat=[38,38,45,38,38,38,45,43];
   pat.forEach((m,i)=>tone(B,mtof(m),t+i*b/2,.2,'sawtooth',.07*f,{lp:520,a:.005,r:.08}));
   kick(B,t);kick(B,t+b);kick(B,t+2*b);kick(B,t+3*b);
   [50,57,62,65,69].forEach(m=>tone(B,mtof(m),t,4*b+.2,'sawtooth',.02*f,{lp:1400,a:.6,r:.5}));
 }},
 /* floating, sparkling arpeggios for the trip through the Solar System */
 space:{bpm:72,wet:.75,vol:1,bar(S,n,t,b){
   const k=n%4,B=S.bus,bass=[38,35,43,45][k],ch=[[62,66,69,73],[59,62,66,69],[55,59,62,66],[57,61,64,66]][k];
   ch.forEach(m=>tone(B,mtof(m),t,4*b+1.5,'triangle',.03,{a:1.5,r:1.5}));
   tone(B,mtof(bass),t,4*b,'sine',.18,{a:.3,r:.5});
   [0,1,2,3,2,1,3,2].forEach((idx,i)=>tone(B,mtof(ch[idx]+(i%4===3?24:12)),t+i*b/2,1.6,'sine',.05,{pluck:1,a:.004}));
   if(n%2)tone(B,mtof(ch[3]+36),t+2*b,2,'sine',.03,{pluck:1,a:.004});
 }},
 /* thruster roar, then a bright chime and a gentle victory theme at touchdown */

   rumble(B,t0,{f0:260,f1:260,v:.22,rise:.6,hold:7,fade:.6});
   tone(B,mtof(40),t0,7,'sawtooth',.03,{lp:300,a:.5,r:.5});
   [74,78,81,86,90].forEach((m,i)=>tone(B,mtof(m),t0+7.05+i*.17,2.4,'sine',.1,{pluck:1,a:.004}));
   [50,57,62,66,69].forEach(m=>tone(B,mtof(m),t0+7,9,'triangle',.05,{a:.8,r:2}));
   tone(B,mtof(38),t0+7,9,'sine',.16,{a:.4,r:2});
  },bar(S,n,t,b){
   if(n<3)return;const B=S.bus,k=(n-3)%4,ch=WCH[k];
   ch.forEach(m=>tone(B,mtof(m),t,4*b,'sine',.035,{a:.5,r:.8}));
   tone(B,mtof(WROOT[k]),t,3*b,'triangle',.14,{a:.05,r:.4});
   WMEL[k].forEach(([o,m,d])=>tone(B,mtof(m),t+o*b,d*b+.4,'triangle',.05,{pluck:1,a:.01}));
 }}
};
function pump(){if(!S||!ctx)return;const sc=SC[S.name];while(S.next<ctx.currentTime+.6){sc.bar&&sc.bar(S,S.n,S.next,60/sc.bpm);S.next+=4*60/sc.bpm;S.n++}}

function unlock(){if(!init())return;if(ctx.state==='suspended')ctx.resume();if(!S)scene(cur)}
['pointerdown','touchend','keydown','click'].forEach(e=>addEventListener(e,unlock,{passive:true}));
